<!DOCTYPE html>
<html lang="en">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Registro</title>
      <link rel="stylesheet" href="/Style/Registro.css">
</head>

<body>
      <div class="padre">
            <h1>
                  Bienvenidos a nuestro Registro
            </h1>
            <div class="hijo">
                  <h2>Registro de Usuario</h2>
                  <div class="hijo_menor">
                        <h3>Nombre: </h3>
                        <input type="text" placeholder="Primer nombre y segundo " class="Tbx" id="Tbx_rol">
                        <h3>Apellido: </h3>
                        <input type="password" placeholder="Primer apellido y segundo" class="Tbx" id="Tbx_rol">
                        <h3>Correo electronico: </h3>
                        <input type="text" placeholder="usuario@gmail.com o usuario@hotmail.com" class="Tbx" id="Tbx_users">
                        <h3>Contraseña: </h3>
                        <input type="password" placeholder="Contraseña" class="Tbx" id="Tbx_users">
                        <h3>Repita su contraseña: </h3>
                        <input type="password" placeholder="Digite otra vez su contraseña" class="Tbx" id="Tbx_users">
                        <h3>Fecha de Nacimiento: </h3>
                        <input type="date" placeholder="Contraseña" class="Tbx" id="Tbx_users">
                        <button class="Btn_ingreso" id="Btn_ingreso" onclick="Ingreso()">Registrar</button>
                  </div>
            </div>
      </div>
</body>

</html>
